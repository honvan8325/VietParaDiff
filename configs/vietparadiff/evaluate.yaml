base_seed: 42
device: auto
precision: auto

model:
  checkpoint: outputs/vietparadiff/htr_guided/best.pt
  contract: outputs/vietparadiff/htr_guided/inference_contract.json
  model_config: outputs/vietparadiff/htr_guided/model_config.json
  vocabulary: outputs/vietparadiff/htr_guided/grapheme_vocabulary.json

