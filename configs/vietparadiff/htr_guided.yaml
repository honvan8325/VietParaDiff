seed: 42
device: auto
precision: auto
stage: htr_guided

initialization:
  checkpoint: outputs/vietparadiff/finetune/best.pt
  contract: outputs/vietparadiff/finetune/inference_contract.json
  model_config: outputs/vietparadiff/finetune/model_config.json
  vocabulary: outputs/vietparadiff/finetune/grapheme_vocabulary.json

guidance:
  checkpoint: outputs/htr/best.pt
  model_config: outputs/htr/model_config.json
  vocabulary: outputs/htr/vocabulary.json
  maximum_weight: 0.05
  warmup_steps: 5000
  maximum_timestep: 250
  every_n_optimizer_steps: 4
  raw_weight: 1.0
  base_weight: 0.5
  shape_weight: 0.25
  tone_weight: 0.25

data:
  real_targets: data/splits/vietparadiff/finetune_targets_real.jsonl
  synthetic_targets: data/splits/vietparadiff/finetune_targets_synthetic.jsonl
  train_references: data/splits/vietparadiff/finetune_references.jsonl
  image_root: .
  num_workers: 4
  batch_size: 1
  gradient_accumulation_steps: 8
  real_batches_per_cycle: 3
  synthetic_batches_per_cycle: 1
  use_synthetic_data: true

autokl:
  checkpoint: outputs/autokl/best.pt
  latent_statistics: outputs/autokl/latent_statistics.json

style: null

diffusion:
  epochs: 10
  num_train_timesteps: 1000
  noise_schedule: cosine

optimizer:
  name: adamw
  learning_rate: 0.00002
  betas: [0.9, 0.99]
  weight_decay: 0.01
  gradient_clip_norm: 1.0

scheduler:
  warmup_steps: 1000
  minimum_learning_rate_ratio: 0.1

logging:
  log_every_steps: 20
  tensorboard: true
  wandb: true
  wandb_mode: offline
  wandb_project: vietparadiff-htr-guided
  wandb_entity: null
  run_name: null

checkpoint:
  output_dir: outputs/vietparadiff/htr_guided
  save_last: true
  save_best: true
