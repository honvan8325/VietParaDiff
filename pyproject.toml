[project]
name = "vietparadiff"
version = "0.1.0"
description = "One-shot Vietnamese paragraph handwriting generation with latent diffusion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.67.1",
    "wandb>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vietparadiff"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
